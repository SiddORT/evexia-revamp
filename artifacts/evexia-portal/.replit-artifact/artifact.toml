kind = "web"
previewPath = "/"
title = "EVEXIA Portal"
description = "EVEXIA Life Sciences portal with authenticated Admin and Medical Representative workspaces, shared server-owned master directories and a separate mock-only Doctor login."
version = "1.0.0"
id = "artifacts/evexia-portal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25965

[services.development]
run = "pnpm --filter @workspace/evexia-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/evexia-portal", "run", "build" ]
serve = "static"
publicDir = "artifacts/evexia-portal/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25965"
BASE_PATH = "/"
