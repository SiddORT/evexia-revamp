# Operator-reviewed exact TLS ingress peers may be supplied here. Empty by
# default: client forwarding headers are never trusted merely for existing.
map "$remote_addr:$http_x_forwarded_proto" $evexia_trusted_proto {
    default $scheme;
    include /etc/nginx/trusted-proto/*.conf;
}

# Optional outer ingress must overwrite X-Real-IP and be an exact reviewed
# socket peer. No external peer is trusted by default. Never append XFF.
map $remote_addr $evexia_trusted_client_peer {
    default 0;
    include /etc/nginx/trusted-client/*.conf;
}
map $evexia_trusted_client_peer $evexia_client_ip {
    default $remote_addr;
    1 $http_x_real_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every static delivery checks live API admission, never a generated/stale
    # Settings allowlist. No cache: revocation applies to the next request.
    auth_request /_host_admission;
    location = /_host_admission {
        internal;
        auth_request off;
        proxy_pass http://backend:8080/api/v1/portal/admission;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For $evexia_client_ip;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto $evexia_trusted_proto;
    }
    # Same-origin auth. Only an explicitly trusted TLS ingress may supply proto
    # directly to the API; this HTTP template never forwards client proto.
    location /api/ {
        auth_request off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For $evexia_client_ip;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto $evexia_trusted_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
