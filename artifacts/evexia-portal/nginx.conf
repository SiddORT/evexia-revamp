server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The fronting ingress must send /api to the existing API service on EVERY
    # connected hostname. Never return SPA HTML as a false API success when that
    # operator-controlled reverse proxy is missing.
    location = /api {
        return 503;
    }
    location ^~ /api/ {
        return 503;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
