kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen", "--no-dev"]

[services.production.run]
args = ["uv", "run", "--frozen", "--no-sync", "python", "-m", "uvicorn", "app.main:app", "--app-dir", "artifacts/api-server/backend", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"
APP_ENV = "production"

[services.production.health.startup]
path = "/api/v1/health/readiness"