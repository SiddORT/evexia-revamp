services:
  postgres:
    image: postgres:17-alpine
    container_name: evexia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - evexia_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: artifacts/api-server/backend/Dockerfile
    container_name: evexia-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: artifacts/evexia-portal/Dockerfile
    container_name: evexia-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

volumes:
  evexia_postgres_data: