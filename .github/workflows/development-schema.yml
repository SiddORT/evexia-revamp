name: Check coordinated development schema

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Standard-library only: no secrets, database, service or production review.
      - run: python -B scripts/review-development-schema.py
