name: Validate exact release artifact

on:
  workflow_call:
    secrets:
      RELEASE_VALIDATION_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UV_PROJECT_ENVIRONMENT: .pythonlibs
      PYTHONPATH: ${{ github.workspace }}/artifacts/api-server/backend:${{ github.workspace }}/.pythonlibs/lib/python3.13/site-packages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: cachix/install-nix-action@v31
      - name: Install existing locked dependencies and browser engines
        run: |
          python -m pip install uv
          uv sync --frozen
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run all gates and issue signed evidence only on complete success
        env:
          VALIDATION_SIGNING_KEY: ${{ secrets.RELEASE_VALIDATION_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VALIDATION_SIGNING_KEY"
          umask 077
          KEY="$RUNNER_TEMP/release-validation-key.pem"
          trap 'rm -f "$KEY"' EXIT
          printf '%s\n' "$VALIDATION_SIGNING_KEY" > "$KEY"
          unset VALIDATION_SIGNING_KEY
          nix-shell -p postgresql_17 --run \
            "python -B scripts/validate-release-artifact.py --signing-key '$KEY' --output '$RUNNER_TEMP/release-validation.json'"
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: ${{ runner.temp }}/release-validation.json
          if-no-files-found: error
          retention-days: 30
