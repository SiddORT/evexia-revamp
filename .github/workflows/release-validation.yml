name: Validate exact release artifact

on:
  workflow_call:
  # Run the complete validation without invoking the VPS deployment workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UV_PROJECT_ENVIRONMENT: .pythonlibs
      PYTHONPATH: ${{ github.workspace }}/artifacts/api-server/backend:${{ github.workspace }}/.pythonlibs/lib/python3.13/site-packages
    steps:
      - name: Initialize runner-temporary release paths
        run: |
          set -euo pipefail
          printf 'UV_CACHE_DIR=%s/uv-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'EVEXIA_RELEASE_PROFILE=%s/release-profile.jsonl\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: cachix/install-nix-action@v31
        with:
          # install-nix-action does not populate <nixpkgs> by default.
          # Pin a reviewed stable package set instead of a moving channel.
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/26f4107e47e3ad0ffd0db220469ba83b6f6d96e8.tar.gz
      - name: Locate locked package download cache
        id: pnpm-cache
        run: echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Download caches only: never persist databases, API processes, browser
      # profiles or authenticated state. No broad restore keys. Schema, locks
      # and synthetic fixture configuration all invalidate these entries.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.store }}
            ${{ runner.temp }}/uv-cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-release-downloads-v1-${{ hashFiles('uv.lock', 'pnpm-lock.yaml', 'pyproject.toml', '**/package.json', 'artifacts/api-server/backend/app/**', 'artifacts/api-server/backend/alembic/**', 'artifacts/api-server/backend/alembic.ini', 'scripts/test-api-foundation.sh', 'scripts/run-authenticated-previews.sh', 'scripts/test-fixture-cache.py', '.github/workflows/release-validation.yml') }}
      - name: Install existing locked dependencies and browser engines
        run: |
          python scripts/profile-release-command.py --output "$EVEXIA_RELEASE_PROFILE" --label install-uv -- python -m pip install uv
          python scripts/profile-release-command.py --output "$EVEXIA_RELEASE_PROFILE" --label install-python -- uv sync --frozen
          python scripts/profile-release-command.py --output "$EVEXIA_RELEASE_PROFILE" --label install-node -- pnpm install --frozen-lockfile
          python scripts/profile-release-command.py --output "$EVEXIA_RELEASE_PROFILE" --label install-engines -- pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify development schema coordination without database access
        # Integration tests run later in validate-template-preferences.sh,
        # inside the existing postgresql_17 Nix environment.
        run: python -B scripts/review-development-schema.py
      - name: Verify separately reviewed production fresh-install target
        run: python -B scripts/review-schema-release.py
      - name: Run all gates and record exact-commit CI result only on complete success
        run: |
          set -euo pipefail
          umask 077
          nix-shell -p postgresql_17 --run \
            "python -B scripts/validate-release-artifact.py --ci-report --output '$RUNNER_TEMP/release-validation.json'"
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: ${{ runner.temp }}/release-validation.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve timing evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-profile
          path: ${{ runner.temp }}/release-profile.jsonl
          if-no-files-found: warn
          retention-days: 30
