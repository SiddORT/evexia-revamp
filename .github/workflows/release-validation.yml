name: Validate exact release artifact

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UV_PROJECT_ENVIRONMENT: .pythonlibs
      PYTHONPATH: ${{ github.workspace }}/artifacts/api-server/backend:${{ github.workspace }}/.pythonlibs/lib/python3.13/site-packages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: cachix/install-nix-action@v31
      - name: Install existing locked dependencies and browser engines
        run: |
          python -m pip install uv
          uv sync --frozen
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify coordinated schema and reviewed fresh-install target
        run: python -B scripts/review-schema-release.py
      - name: Run all gates and record exact-commit CI result only on complete success
        run: |
          set -euo pipefail
          umask 077
          nix-shell -p postgresql_17 --run \
            "python -B scripts/validate-release-artifact.py --ci-report --output '$RUNNER_TEMP/release-validation.json'"
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: ${{ runner.temp }}/release-validation.json
          if-no-files-found: error
          retention-days: 30
